name: Continuous Deployment
on:
  push:
    branches: 
      - "main"

jobs: 
  redeploying_everything:
    name: "Deplopying every push"

    steps: 
      - run: |
          echo ${{secrets.SSH_KEY}} &> ~/ssh_key
          ssh -i ~/ssh_key ubuntu@ec2-3-238-142-128.compute-1.amazonaws.com
          cd Excali-Paint && git pull
          pnpm install
          pnpm run build
          pm2 restart ecosyste.config.js