name: Continuous Deployment

on:
  push:
    branches:
      - "main"

jobs:
  redeploying_everything:
    name: "Deploying every push"
    runs-on: ubuntu-latest   # ← REQUIRED

    steps:
      - run: |
          echo "${{ secrets.SSH_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -i ~/ssh_key ubuntu@ec2-3-238-142-128.compute-1.amazonaws.com << 'EOF'
            cd Excali-Paint
            git pull
            pnpm install
            pnpm run build
            pm2 restart ecosystem.config.js
          EOF
